name: trisula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: Review only the first N files (empty = all)
        required: false
        default: ""
      models:
        description: Comma-separated model keys (empty = llm.active_models)
        required: false
        default: ""
      scenarios:
        description: Comma-separated LLM scenarios
        required: false
        default: "B,C"

# Eksperimen lewat workflow_dispatch punya grup sendiri supaya tidak dibatalkan oleh push.
concurrency:
  group: trisula-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions: {}

jobs:
  prefilter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      language: ${{ steps.settings.outputs.language }}
      build_mode: ${{ steps.settings.outputs.build_mode }}
      codeql_config: ${{ steps.settings.outputs.codeql_config }}
      review_matrix: ${{ steps.settings.outputs.review_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trisula

      - id: settings
        env:
          INPUT_MODELS: ${{ inputs.models }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from trisula.config import load_config
          config = load_config()
          models = [m.strip() for m in os.environ["INPUT_MODELS"].split(",") if m.strip()] or config.llm.active_models
          scenarios = [s.strip() for s in os.environ["INPUT_SCENARIOS"].split(",") if s.strip()] or list(config.llm.scenarios)
          unknown = [m for m in models if m not in config.llm.models] + [s for s in scenarios if s not in config.llm.scenarios]
          if unknown:
              raise SystemExit(f"unknown models or scenarios: {unknown}")
          include = [
              {"model": m, "scenario": s, "key_env": config.llm.models[m].api_key_env or ""}
              for m in models
              for s in scenarios
          ]
          print(f"review_matrix={json.dumps({'include': include})}")
          print(f"language={config.project.language}")
          print(f"build_mode={config.analysis.codeql.build_mode}")
          print("codeql_config<<CODEQL_CONFIG")
          print("queries:")
          print(f"  - uses: {config.analysis.codeql.query_suite}")
          print("paths:")
          for path in config.project.source_paths:
              print(f"  - {path}")
          print("CODEQL_CONFIG")
          PY

      - uses: actions/cache@v6
        with:
          path: .cache/benchmark
          key: benchmark-${{ hashFiles('config/trisula.yml') }}
          restore-keys: benchmark-
      - run: python -m trisula sample
      - run: python -m trisula sanitize

      # DATASET.md bagian 4: proyek hasil pangkas harus tetap terkompilasi. Kegagalan dicatat, tidak menghentikan
      # pipeline, karena CodeQL build-mode none tetap bisa berjalan.
      - id: compile
        continue-on-error: true
        working-directory: targets/benchmark
        run: mvn -q -B -DskipTests compile
      - run: |
          mkdir -p results
          echo "{\"maven_compile\": \"${{ steps.compile.outcome }}\"}" > results/compile_status.json

      - uses: actions/upload-artifact@v7
        with:
          name: target
          path: |
            targets/
            data/
            results/compile_status.json
          if-no-files-found: error

  codeql:
    needs: prefilter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trisula
      - uses: actions/download-artifact@v8
        with:
          name: target

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ needs.prefilter.outputs.language }}
          build-mode: ${{ needs.prefilter.outputs.build_mode }}
          config: ${{ needs.prefilter.outputs.codeql_config }}

      - id: analyze_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ needs.prefilter.outputs.language }}
          output: results/codeql
          # Token PR dari fork tidak boleh menulis ke Code Scanning.
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}
      - env:
          ANALYZE_START: ${{ steps.analyze_start.outputs.epoch }}
        run: |
          end=$(date +%s)
          echo "{\"duration_seconds\": $((end - ANALYZE_START))}" > results/codeql/timing.json

      - run: python -m trisula parse-sarif
      - uses: actions/upload-artifact@v7
        with:
          name: codeql
          path: results/codeql/
          if-no-files-found: error

  review:
    needs: [prefilter, codeql]
    # Job yang memakai secret tidak berjalan untuk PR dari fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prefilter.outputs.review_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trisula
      - uses: actions/download-artifact@v8
        with:
          name: target
      - uses: actions/download-artifact@v8
        with:
          name: codeql
          path: results/codeql

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/llm/${{ matrix.model }}
          key: llm-${{ matrix.model }}-${{ matrix.scenario }}-${{ github.run_id }}
          restore-keys: |
            llm-${{ matrix.model }}-${{ matrix.scenario }}-
            llm-${{ matrix.model }}-

      # Hanya kunci milik model di matrix ini yang diteruskan ke proses.
      - env:
          MODEL: ${{ matrix.model }}
          SCENARIO: ${{ matrix.scenario }}
          LIMIT: ${{ inputs.limit }}
          GEMINI_API_KEY: ${{ matrix.key_env == 'GEMINI_API_KEY' && secrets.GEMINI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.key_env == 'OPENAI_API_KEY' && secrets.OPENAI_API_KEY || '' }}
          XAI_API_KEY: ${{ matrix.key_env == 'XAI_API_KEY' && secrets.XAI_API_KEY || '' }}
        run: python -m trisula review --model "$MODEL" --scenario "$SCENARIO" ${LIMIT:+--limit "$LIMIT"}

      # Respons yang sudah dibayar tetap disimpan walau job gagal di tengah jalan.
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/llm/${{ matrix.model }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ matrix.model }}-${{ matrix.scenario }}
          path: |
            results/verdicts/
            results/raw/
          if-no-files-found: warn

  aggregate:
    needs: [prefilter, codeql, review]
    # Tetap berjalan jika sebagian kombinasi review gagal, supaya hasil yang ada tetap dievaluasi.
    if: >-
      !cancelled() && needs.codeql.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trisula
      - uses: actions/download-artifact@v8
        with:
          name: target
      - uses: actions/download-artifact@v8
        with:
          name: codeql
          path: results/codeql
      - uses: actions/download-artifact@v8
        with:
          pattern: review-*
          path: results
          merge-multiple: true
      - run: python -m trisula ensemble
      - run: python -m trisula evaluate
      - uses: actions/upload-artifact@v7
        with:
          name: aggregate
          path: |
            results/findings.jsonl
            results/summary.csv
            results/summary.json
            results/per_case.csv
          if-no-files-found: error

  report:
    needs: [prefilter, aggregate]
    if: >-
      !cancelled() && needs.aggregate.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trisula
      - uses: actions/download-artifact@v8
        with:
          name: target
      - uses: actions/download-artifact@v8
        with:
          name: codeql
          path: results/codeql
      - uses: actions/download-artifact@v8
        with:
          pattern: review-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: aggregate
          path: results
      - run: python -m trisula report

      # Tanpa input category, tiap file memakai automationDetails.id-nya (trisula-<model>/), sehingga tiap model
      # tampil sebagai tool terpisah di tab Security.
      - if: hashFiles('results/sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results/sarif
      - if: github.event_name == 'pull_request' && hashFiles('results/pr_comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file results/pr_comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            results/report.html
            results/figures/
            results/sarif/
            results/pr_comment.md
            results/summary.json
            results/summary.csv
          if-no-files-found: warn
